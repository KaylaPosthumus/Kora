name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc runs under "strict", so a type error fails here as well as in the build.
      - name: Typecheck
        run: npm run typecheck

      # Exits 0 today with 205 warnings and no errors. A new error fails the job.
      - name: Lint
        run: npm run lint

      # The suite mocks the Firebase SDK at the module boundary, so it needs no
      # credentials and touches no live project.
      - name: Test
        run: npm test

      # Catches anything that only breaks in a production build — a bad asset path,
      # a dev-only import that survived tree-shaking.
      - name: Build
        run: npm run build
