name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc runs under "strict", so a type error fails here as well as in the build.
      - name: Typecheck
        run: npm run typecheck

      # Exits 0 today with 205 warnings and no errors. A new error fails the job.
      - name: Lint
        run: npm run lint

      # The suite mocks the Firebase SDK at the module boundary, so it needs no
      # credentials and touches no live project.
      - name: Test
        run: npm test

      # Catches anything that only breaks in a production build — a bad asset path,
      # a dev-only import that survived tree-shaking.
      - name: Build
        run: npm run build

  # functions/ is a separate package with its own dependency tree, tsconfig and
  # Vitest config, and none of the steps above reach it: the root `typecheck`
  # includes only `src`, `lint` globs only `src`, and the root Vitest `include`
  # is anchored at the repo root so `functions/src` never matches. Without this
  # job the backend is unguarded.
  #
  # A separate job rather than more steps on `verify`, so the two run in
  # parallel and a failure names which half broke.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The root lockfile is a different tree; cache on this package's own.
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Pure decision modules plus injected backends, so this needs no emulator,
      # no credentials and no network — same as the app suite.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # tsc accepts a default import from a CommonJS module that has none:
      # `import x from "firebase-functions/v1"` typechecks, then compiles to
      # `undefined`. That only fails when the emitted bundle is required — which
      # is what deploy-time analysis does — so require it here rather than
      # discovering it mid-deploy.
      - name: Load the deploy surface
        run: |
          node -e "
            const fns = require('./lib/index.js');
            const names = Object.keys(fns);
            if (names.length === 0) throw new Error('index.ts exported no functions');
            console.log('deploy surface:', names.join(', '));
          "
        env:
          GCLOUD_PROJECT: kora-51711

  # firestore.rules is the whole of Kora's access control — there is no backend
  # in front of Firestore — so it gets its own job. These tests run the real
  # rules engine in the emulator, which is the only thing that catches the class
  # of bug they were written for: reading an absent custom claim by dot access
  # raises an evaluation error rather than returning null, and no unit test or
  # static check sees that.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install firebase-tools
        run: npm install --global firebase-tools

      - run: npm ci --prefix rules-tests

      - name: Typecheck
        run: npm run typecheck --prefix rules-tests

      # Starts the emulator, runs the suite against it, shuts it down. The
      # project is `demo-kora`: the demo- prefix forces the emulator's offline
      # mode, so this needs no credentials and cannot reach kora-51711.
      - name: Test rules
        run: npm run test:rules
